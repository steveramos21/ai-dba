name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm test

      # Integration tests require 5 Docker database containers:
      # MySQL 13306, PostgreSQL 15432, SQL Server 11433, Oracle 11521, MongoDB 12017
      # Run manually: docker compose up -d && node test/integration-all.mjs
      - name: Verify CLI entry point
        run: node dist/index.js --version